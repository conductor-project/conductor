[workspace]
members = [
    "crates/conductor",
    "crates/conductor-core",
    "crates/conductor-manager",
    "crates/conductor-worker",
    "crates/conductor-process",
    "crates/conductor-api",
    "crates/conductor-transport",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.99.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
conductor-core = { path = "crates/conductor-core", default-features = false }
conductor-manager = { path = "crates/conductor-manager", default-features = false }
conductor-worker = { path = "crates/conductor-worker", default-features = false }
conductor-process = { path = "crates/conductor-process", default-features = false }
conductor-api = { path = "crates/conductor-api", default-features = false }
conductor-transport = { path = "crates/conductor-transport", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
ctrlc = { version = "3.4", default-features = false, features = ["termination"] }
clap = { version = "4.5", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls"] }
axum-server-mtls = { version = "0.1.2", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser", "zeroize"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
sha2 = { version = "0.11.0", default-features = false }
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
time = { version = "0.3.55", default-features = false, features = ["std"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
x509-parser = { version = "0.18.1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
nix = { version = "0.31.3", default-features = false, features = ["poll", "process", "signal"] }
landlock = { version = "0.4.7", default-features = false }
close_fds = { version = "0.3.2", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
overflow-checks = true
debug-assertions = true
panic = "unwind"
debug = "line-tables-only"
strip = "none"
