name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Apple silicon arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.99.1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check dependency and lint policy
        run: python3 scripts/check-dependency-policy.py
      - name: Check formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Build all targets
        run: cargo +1.99.1 build --workspace --locked --all-targets --all-features
      - name: Lint
        run: cargo +1.99.1 clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Test debug and portable process lifecycle
        run: cargo +1.99.1 test --workspace --locked --all-targets --all-features

  macos-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: macOS release (Apple silicon arm64)
    needs: [macos]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.99.1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Test release and portable process lifecycle
        run: cargo +1.99.1 test --release --workspace --locked --all-targets --all-features
      - name: Build release
        run: cargo +1.99.1 build --workspace --locked --release
      - name: Check inherited descriptor hygiene
        run: python3 scripts/test-inherited-fds.py target/release/conductor

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.99.1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check dependency and lint policy
        run: python3 scripts/check-dependency-policy.py
      - name: Check formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Build all targets
        run: cargo +1.99.1 build --workspace --locked --all-targets --all-features
      - name: Lint
        run: cargo +1.99.1 clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Test debug
        run: cargo +1.99.1 test --workspace --locked --all-targets --all-features

  linux-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Linux release and enforcement
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.99.1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check dependency and lint policy
        run: python3 scripts/check-dependency-policy.py
      - name: Test release
        run: cargo +1.99.1 test --release --workspace --locked --all-targets --all-features
      - name: Build release
        run: cargo +1.99.1 build --workspace --locked --release
      - name: Prepare delegated cgroup v2 subtree
        run: |
          sudo sh -c 'printf "+cpu +memory +pids" > /sys/fs/cgroup/cgroup.subtree_control'
          sudo mkdir /sys/fs/cgroup/conductor-ci
          sudo chown "$(id -un):$(id -gn)" /sys/fs/cgroup/conductor-ci
          sudo sh -c 'printf "+cpu +memory +pids" > /sys/fs/cgroup/conductor-ci/cgroup.subtree_control'
          sudo chown "$(id -u):$(id -g)" /sys/fs/cgroup/conductor-ci/cgroup.procs /sys/fs/cgroup/conductor-ci/cgroup.subtree_control
          printf 'CONDUCTOR_CGROUP_ROOT=/sys/fs/cgroup/conductor-ci\n' >> "$GITHUB_ENV"
      - name: Test real cgroup v2 enforcement and recovery
        run: sudo --preserve-env=CONDUCTOR_CGROUP_ROOT env CONDUCTOR_CGROUP_TRACE=1 python3 scripts/test-cgroup-v2.py --binary target/release/conductor --delegated-root "$CONDUCTOR_CGROUP_ROOT"
      - name: Test real Landlock filesystem enforcement
        run: sudo --preserve-env=CONDUCTOR_CGROUP_ROOT python3 scripts/test-landlock.py --binary target/release/conductor --delegated-root "$CONDUCTOR_CGROUP_ROOT"
      - name: Qualify Linux run capacity
        run: python3 scripts/qualify-linux-capacity.py --binary target/release/conductor --runs 64
      - name: Run release lifecycle demo
        run: python3 scripts/demo-agent.py --binary target/release/conductor --include-crash
