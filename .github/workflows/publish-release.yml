name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to prepare, rehearse, or publish
        required: true
        type: string
      action:
        description: Rehearse without writes, prepare a draft, or publish an approved draft
        required: true
        type: choice
        options:
          - rehearse
          - prepare
          - publish

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and prepare release
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0
      - name: Verify release tag, authorized branch, and version
        id: candidate
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=${RELEASE_TAG#v}
          manifest_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          [[ "$manifest_version" == "$version" ]]
          major=$(sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\1/' <<<"$RELEASE_TAG")
          minor=$(sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\2/' <<<"$RELEASE_TAG")
          sha=$(git rev-parse "${RELEASE_TAG}^{commit}")
          line="$major.$minor"
          if git merge-base --is-ancestor "$sha" origin/main; then
            branch=main
          else
            branch="release/$line"
          fi
          git merge-base --is-ancestor "$sha" "origin/$branch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Find successful trusted build for exact source commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
          LINE: ${{ steps.candidate.outputs.line }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          branch="$BRANCH"
          runs=$(gh run list --workflow merge.yml --branch "$branch" --commit "$SHA" --limit 100 --json databaseId,headSha,headBranch,status,conclusion)
          run_id=$(jq -r --arg sha "$SHA" --arg branch "$branch" '[.[] | select(.headSha == $sha and .headBranch == $branch and .status == "completed" and .conclusion == "success")] | sort_by(.databaseId) | last | .databaseId // empty' <<<"$runs")
          [[ -n "$run_id" ]]
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download exact-run package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh run download "$RUN_ID" --dir candidate
          [[ -d candidate/conductor-linux-packages-x86_64-release ]]
          [[ -d candidate/conductor-linux-packages-aarch64-release ]]
      - name: Verify package metadata, checksums, signatures, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          VERSION: ${{ steps.candidate.outputs.version }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev rpm
          gh attestation verify --help >/dev/null
          for arch in x86_64 aarch64; do
            dir="candidate/conductor-linux-packages-${arch}-release"
            (cd "$dir" && sha256sum --check SHA256SUMS)
            python3 scripts/verify-release-candidate.py "$dir" "$VERSION" "$SOURCE_SHA" "$arch"
            for package in "$dir"/*.deb "$dir"/*.rpm; do
              cosign verify-blob --bundle "${package}.sigstore.json" --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/merge.yml@refs/heads/${BRANCH}" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$package"
              gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/merge.yml"
            done
          done
          printf '%s\n' "$SOURCE_SHA" > candidate/SOURCE-COMMIT
          printf 'Tag: %s\nSource commit: %s\nVerified merge run: %s\n' "$RELEASE_TAG" "$SOURCE_SHA" "${{ steps.run.outputs.id }}" > candidate/RELEASE-PROVENANCE.txt
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Create or resume verified draft release
        if: github.event_name == 'push' || inputs.action == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          VERSION: ${{ steps.candidate.outputs.version }}
          RUN_ID: ${{ steps.run.outputs.id }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --title "Conductor $VERSION" --notes "Verified Conductor release candidate.\n\nSource: $SOURCE_SHA\nTrusted merge workflow run: $RUN_ID\nPackages were promoted from that run without rebuilding."
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          for dir in candidate/conductor-linux-packages-*-release; do
            for file in "$dir"/*; do
              name=$(basename "$file")
              if gh release download "$RELEASE_TAG" --pattern "$name" --dir /tmp/release-existing >/dev/null 2>&1; then
                cmp "$file" "/tmp/release-existing/$name"
              else
                gh release upload "$RELEASE_TAG" "$file"
              fi
            done
          done
          for file in candidate/SOURCE-COMMIT candidate/RELEASE-PROVENANCE.txt; do
            name=$(basename "$file")
            if gh release download "$RELEASE_TAG" --pattern "$name" --dir /tmp/release-existing >/dev/null 2>&1; then
              cmp "$file" "/tmp/release-existing/$name"
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
          find candidate/conductor-linux-packages-*-release -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/expected-assets
          printf '%s\n' SOURCE-COMMIT RELEASE-PROVENANCE.txt >> /tmp/expected-assets
          sort -o /tmp/expected-assets /tmp/expected-assets
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > /tmp/actual-assets
          diff -u /tmp/expected-assets /tmp/actual-assets
      - name: Rehearsal completed without release writes
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rehearse'
        run: echo "Candidate verification succeeded; no release or tag was created or changed."

  publish:
    name: Publish approved draft
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish'
    needs: promote
    runs-on: ubuntu-26.04
    environment: release-publication
    permissions:
      contents: write
    steps:
      - name: Verify release publication environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rules=$(gh api "repos/${GITHUB_REPOSITORY}/environments/release-publication" --jq '.protection_rules // []')
          jq -e 'any(.[]; .type == "required_reviewers" and (.reviewers | length > 0))' <<<"$rules"
          jq -e 'any(.[]; .type == "required_reviewers" and .prevent_self_review == true)' <<<"$rules"
      - name: Publish the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
          [[ "$draft" == true ]]
          gh release edit "$RELEASE_TAG" --draft=false
