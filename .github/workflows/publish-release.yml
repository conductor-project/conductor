name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to prepare, rehearse, or publish
        required: true
        type: string
      action:
        description: Rehearse without writes, prepare a draft, or publish an approved draft
        required: true
        type: choice
        options:
          - rehearse
          - prepare
          - approval-rehearsal
          - publish

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify release candidate
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      line: ${{ steps.candidate.outputs.line }}
      sha: ${{ steps.candidate.outputs.sha }}
      run_id: ${{ steps.run.outputs.id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'push' && github.event.repository.default_branch || github.sha }}
          path: workflow-source
          fetch-depth: 1
      - name: Verify release tag, authorized branch, and version
        id: candidate
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          manifest_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          candidate=$(python3 "$GITHUB_WORKSPACE/workflow-source/scripts/resolve-release-ref.py" "$GITHUB_WORKSPACE" "$RELEASE_TAG" "$manifest_version")
          echo "version=$(jq -r .version <<<"$candidate")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .sha <<<"$candidate")" >> "$GITHUB_OUTPUT"
          echo "line=$(jq -r .line <<<"$candidate")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .branch <<<"$candidate")" >> "$GITHUB_OUTPUT"
      - name: Find successful trusted build for exact source commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
          LINE: ${{ steps.candidate.outputs.line }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          branch="$BRANCH"
          runs=$(gh run list --workflow merge.yml --branch "$branch" --commit "$SHA" --limit 100 --json databaseId,headSha,headBranch,status,conclusion)
          run_id=$(jq -r --arg sha "$SHA" --arg branch "$branch" '[.[] | select(.headSha == $sha and .headBranch == $branch and .status == "completed" and .conclusion == "success")] | sort_by(.databaseId) | last | .databaseId // empty' <<<"$runs")
          if [[ -z "$run_id" ]]; then
            echo "No successful Merge workflow run was found for $SHA on authorized branch $branch." >&2
            echo "Inspect that exact commit's Merge run, fix or rerun its release checks, and dispatch this workflow again after it succeeds." >&2
            exit 1
          fi
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download exact-run package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '[.artifacts[] | select(.expired == false) | .name]')
          for name in conductor-linux-packages-x86_64-release conductor-linux-packages-aarch64-release; do
            if ! jq -e --arg name "$name" 'index($name) != null' <<<"$artifacts" >/dev/null; then
              echo "Required artifact $name is missing or expired in trusted Merge run $RUN_ID." >&2
              echo "Recovery: run 'gh run rerun $RUN_ID' to regenerate artifacts for the same source commit, wait for success, then dispatch Publish release with action=prepare." >&2
              exit 1
            fi
          done
          mkdir -p candidate
          gh run download "$RUN_ID" --dir candidate
          [[ -d candidate/conductor-linux-packages-x86_64-release ]]
          [[ -d candidate/conductor-linux-packages-aarch64-release ]]
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Verify package metadata, checksums, signatures, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          VERSION: ${{ steps.candidate.outputs.version }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev rpm rpm2cpio cpio
          gh attestation verify --help >/dev/null
          for arch in x86_64 aarch64; do
            dir="candidate/conductor-linux-packages-${arch}-release"
            python3 "$GITHUB_WORKSPACE/workflow-source/scripts/verify-release-candidate.py" "$dir" "$VERSION" "$SOURCE_SHA" "$arch"
            for package in "$dir"/*.deb "$dir"/*.rpm; do
              cosign verify-blob --bundle "${package}.sigstore.json" --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/merge.yml@refs/heads/${BRANCH}" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$package"
              gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/merge.yml"
            done
          done
          printf '%s\n' "$SOURCE_SHA" > candidate/SOURCE-COMMIT
          printf 'Tag: %s\nSource commit: %s\nVerified merge run: %s\n' "$RELEASE_TAG" "$SOURCE_SHA" "${{ steps.run.outputs.id }}" > candidate/RELEASE-PROVENANCE.txt
      - name: Stage verified release assets
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action != 'rehearse')
        run: |
          set -euo pipefail
          mkdir release-assets
          for arch in aarch64 x86_64; do
            dir="candidate/conductor-linux-packages-${arch}-release"
            if [[ "$arch" == aarch64 ]]; then
              cp "$dir/BUILD-INFO.json" release-assets/BUILD-INFO.json
              cp "$dir/SHA256SUMS" release-assets/SHA256SUMS
            else
              cp "$dir/BUILD-INFO.json" release-assets/BUILD-INFO-x86_64.json
              sed 's/  BUILD-INFO.json$/  BUILD-INFO-x86_64.json/' \
                "$dir/SHA256SUMS" > release-assets/SHA256SUMS-x86_64
            fi
            for package in "$dir"/*.deb "$dir"/*.rpm; do
              cp "$package" release-assets/
              cp "${package}.sigstore.json" release-assets/
            done
          done
          cp candidate/SOURCE-COMMIT candidate/RELEASE-PROVENANCE.txt release-assets/
          (cd release-assets && sha256sum --check SHA256SUMS SHA256SUMS-x86_64)
      - name: Verify existing draft matches verified candidate
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          gh release download "$RELEASE_TAG" --dir /tmp/published-candidate
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/expected-assets
          find /tmp/published-candidate -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/actual-assets
          diff -u /tmp/expected-assets /tmp/actual-assets
          while IFS= read -r file; do cmp "release-assets/$file" "/tmp/published-candidate/$file"; done < /tmp/expected-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'prepare' || inputs.action == 'publish' || inputs.action == 'approval-rehearsal'))
        with:
          name: verified-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1
      - name: Rehearsal completed without release writes
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rehearse'
        run: echo "Candidate verification succeeded; no release or tag was created or changed."

  draft:
    name: Create or resume verified draft
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'prepare')
    needs: promote
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-assets
          path: release-assets
      - name: Create or resume verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          VERSION: ${{ needs.promote.outputs.version }}
          LINE: ${{ needs.promote.outputs.line }}
          RUN_ID: ${{ needs.promote.outputs.run_id }}
          SOURCE_SHA: ${{ needs.promote.outputs.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            cat > /tmp/release-notes.md <<EOF
          Verified Conductor release candidate for $VERSION.

          ## Compatibility and upgrade

          This release belongs to the $LINE support line. Upgrade manager and worker binaries together. Review the [package installation and upgrade guide](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/docs/package-install.md) before upgrading. No database downgrade is supported; use a verified backup and the documented restore procedure for recovery.

          ## Packages and verification

          Debian and RPM packages are provided for x86_64 and arm64. Verify package checksums, Cosign bundles, and GitHub artifact attestations using the package installation guide.

          ## Known limitations

          This release does not provide a hosted APT or DNF repository. Installations require operator-managed package downloads and service configuration.

          Source commit: $SOURCE_SHA
          Trusted Merge workflow run: $RUN_ID
          EOF
            gh release create "$RELEASE_TAG" --draft --title "Conductor $VERSION" --notes-file /tmp/release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          for file in release-assets/*; do
            name=$(basename "$file")
            if gh release download "$RELEASE_TAG" --pattern "$name" --dir /tmp/release-existing >/dev/null 2>&1; then
              cmp "$file" "/tmp/release-existing/$name"
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/expected-assets
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > /tmp/actual-assets
          diff -u /tmp/expected-assets /tmp/actual-assets

  publish:
    name: Protected publication gate
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'publish' || inputs.action == 'approval-rehearsal')
    needs: promote
    runs-on: ubuntu-26.04
    environment: release-publication
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.action == 'publish'
        with:
          name: verified-release-assets
          path: verified-release-assets
      - name: Verify release publication environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rules=$(gh api "repos/${GITHUB_REPOSITORY}/environments/release-publication" --jq '.protection_rules // []')
          jq -e 'any(.[]; .type == "required_reviewers" and (.reviewers | length > 0))' <<<"$rules"
          jq -e 'any(.[]; .type == "required_reviewers" and .prevent_self_review == true)' <<<"$rules"
      - name: Complete approval rehearsal without publishing
        if: inputs.action == 'approval-rehearsal'
        run: echo "Protected environment approval succeeded; no release was published."
      - name: Publish the existing draft
        if: inputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
          [[ "$draft" == true ]]
          gh release download "$RELEASE_TAG" --dir /tmp/final-release-assets
          find verified-release-assets -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/expected-assets
          find /tmp/final-release-assets -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/actual-assets
          diff -u /tmp/expected-assets /tmp/actual-assets
          while IFS= read -r file; do cmp "verified-release-assets/$file" "/tmp/final-release-assets/$file"; done < /tmp/expected-assets
          gh release edit "$RELEASE_TAG" --draft=false
