name: Merge

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: merge-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.99.1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Test release
        run: cargo +1.99.1 test --release --workspace --locked --all-targets --all-features
      - name: Build release
        run: cargo +1.99.1 build --workspace --locked --release
