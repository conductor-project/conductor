[package]
name = "conductor-api"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
client = ["dep:reqwest"]
server = [
    "dep:async-trait", "dep:axum", "dep:base64", "dep:conductor-manager", "dep:hickory-server",
    "dep:ipnet", "dep:sha2", "dep:subtle", "dep:tokio",
]

[dependencies]
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
hickory-server = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
conductor-core.workspace = true
conductor-manager = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["stream"] }

[dev-dependencies]
tower.workspace = true
rusqlite.workspace = true
tokio.workspace = true

[lints]
workspace = true
